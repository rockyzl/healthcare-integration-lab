[project]
name = "healthcare-integration-lab"
version = "0.1.0"
description = "Independent FHIR, SQL Server and Oracle integration learning lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pymssql>=2.3,<3", "oracledb>=3,<5", "python-dotenv>=1,<2",
  "langchain>=1,<2", "langgraph>=1,<2", "langchain-google-genai>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
